[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "adamas-robot-sdk"
version = "0.8.0"
description = "Adamas robot adapter SDK"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.7.4", "livekit>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["adamas_robot_sdk*"]
