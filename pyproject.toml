[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adamas-robot-sdk"
version = "0.9.0"
description = "Adamas teleoperation SDK for robot control, JSON telemetry, and video"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["certifi>=2024.7.4", "livekit>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["adamas_robot_sdk*"]
